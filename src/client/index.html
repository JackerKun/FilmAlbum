<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171b18" />
    <title>Film Album Studio · 胶片档案馆</title>
    <link rel="icon" type="image/png" href="/assets/icons/icon-32.png" />
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="/timeline.css" />
    <link rel="stylesheet" href="/film-pull.css" />
    <link rel="stylesheet" href="/book-designer.css" />
    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <link rel="stylesheet" href="/atlas.css" />
  </head>
  <body data-theme="paper">
    <div id="app">
      <header class="topbar">
        <button class="brand" data-action="home">
          <img class="brand-icon" src="/assets/icons/icon-256.png" alt="" /><span
            >FILM ALBUM<small>PERSONAL FILM ARCHIVE</small></span
          >
        </button>
        <div class="navigation-history" role="group" aria-label="浏览历史">
          <button
            id="nav-back"
            type="button"
            data-action="nav-back"
            aria-label="后退"
            title="后退"
            disabled
          >
            <span aria-hidden="true">‹</span>
          </button>
          <button
            id="nav-forward"
            type="button"
            data-action="nav-forward"
            aria-label="前进"
            title="前进"
            disabled
          >
            <span aria-hidden="true">›</span>
          </button>
        </div>
        <button id="global-search" class="global-search" data-action="command">
          <span>⌕ 搜索照片、胶卷、位置与命令</span><kbd>⌘ K</kbd>
        </button>
        <div class="top-actions">
          <button data-action="random" title="随机抽一卷">⚄ 随机一卷</button
          ><button data-action="history" title="操作历史">↶</button
          ><button data-action="theme" title="切换暗房黑、纸张白、灯箱灰">◐</button
          ><button class="primary" data-action="import">＋ 导入影像</button>
        </div>
      </header>
      <nav id="workspace-nav" class="workspace-nav" aria-label="工作区">
        <button data-workspace="archive" class="active"><span>▤</span>档案馆</button
        ><button data-workspace="lighttable"><span>▦</span>看片台</button
        ><button data-workspace="projects"><span>◫</span>项目 / 策展</button
        ><button data-workspace="atlas"><span>◎</span>回忆地图</button
        ><button data-action="books">▧ 定制画册</button
        ><button data-workspace="storage"><span>▧</span>资料库</button>
      </nav>
      <div id="update-banner" class="update-banner" hidden>
        <span role="status"><span>发现新版本</span> <b id="update-version"></b></span>
        <a id="update-download" target="_blank" rel="noopener noreferrer">去下载</a>
        <button id="update-dismiss" type="button" aria-label="关闭">×</button>
      </div>
      <div class="app-body">
        <aside id="sidebar" class="sidebar">
          <header>
            <small>YOUR LIBRARY</small>
            <h2 id="library-title">我的胶片档案馆</h2>
            <p id="library-counts">正在连接资料库…</p>
          </header>
          <div id="side-content"></div>
          <footer>
            <button data-action="new-roll">＋ 新建胶卷</button
            ><button data-action="save-layout">▣ 保存当前布局</button>
          </footer>
        </aside>
        <div class="resize-handle" id="side-resizer" title="拖动调整导航宽度"></div>
        <main id="main">
          <div id="workspace-header" class="workspace-header"></div>
          <div id="query-bar" class="query-bar"></div>
          <div id="selection-bar" class="selection-bar" hidden></div>
          <div id="view-content" class="view-content"><div class="empty">正在打开档案馆…</div></div>
          <footer id="pagination" class="pagination"></footer>
        </main>
        <div class="resize-handle" id="inspector-resizer" title="拖动调整检查器宽度"></div>
        <aside id="inspector" class="inspector">
          <div class="empty">
            选择胶卷或照片<br /><small>档案、版本与实物位置会显示在这里</small>
          </div>
        </aside>
      </div>
      <footer class="statusbar">
        <span id="status-text">本地资料库 · 原片保存在你的设备</span><span id="save-status"></span
        ><button id="tasks-toggle" data-action="tasks">后台任务 <b id="task-count">0</b> ▴</button>
      </footer>
      <section id="task-drawer" class="task-drawer" hidden>
        <header><b>任务中心</b><button data-action="tasks">收起 ▾</button></header>
        <div id="task-list"></div>
      </section>
    </div>
    <dialog id="editor" class="editor">
      <form id="editor-form">
        <header>
          <div>
            <small id="editor-kicker">FILM ALBUM</small>
            <h2 id="editor-title"></h2>
          </div>
          <button type="button" data-action="close-editor" aria-label="关闭">×</button>
        </header>
        <div id="editor-body"></div>
        <footer id="editor-footer"></footer>
      </form>
    </dialog>
    <dialog id="command-dialog" class="command-dialog">
      <input
        id="command-input"
        placeholder="输入胶卷、照片、编号或命令…"
        autocomplete="off"
        aria-label="全局搜索与命令"
      />
      <div id="command-results"></div>
      <footer>↑ ↓ 选择 · Enter 执行 · Esc 返回</footer>
    </dialog>
    <dialog id="reviewer" class="reviewer">
      <header>
        <div><small>LIGHT TABLE</small><b id="review-title">照片审阅</b></div>
        <nav id="review-tools">
          <button data-action="review-prev">‹</button><button data-action="review-next">›</button
          ><button data-action="review-fit">适合 F</button
          ><button data-action="review-actual">100% Z</button
          ><button data-action="review-minus">−</button><button data-action="review-plus">＋</button
          ><button data-action="review-sync" id="review-sync" aria-pressed="true">同步</button
          ><button data-action="review-lock" id="review-lock" aria-pressed="false">锁定参考</button
          ><button data-action="review-wipe" id="review-wipe" aria-pressed="false">版本擦拭</button
          ><button
            data-action="review-info"
            id="review-info"
            aria-expanded="false"
            aria-controls="review-details"
          >
            信息 I</button
          ><button data-action="close-review" aria-label="关闭看片台">×</button>
        </nav>
      </header>
      <div class="review-body">
        <div id="review-grid" class="review-grid"></div>
        <aside id="review-details" class="review-details" hidden></aside>
      </div>
      <div id="wipe-control" class="wipe-control" hidden>
        <span>扫描版本对照</span
        ><input
          id="wipe-range"
          type="range"
          min="0"
          max="100"
          value="50"
          aria-label="调整版本对照分界线"
        />
      </div>
      <footer>
        <span id="review-name"></span>
        <div id="review-rating" class="stars"></div>
        <select id="review-color" aria-label="照片色标">
          <option value="">无色标</option>
          <option value="red">红色</option>
          <option value="yellow">黄色</option>
          <option value="green">绿色</option>
          <option value="blue">蓝色</option>
          <option value="purple">紫色</option></select
        ><button data-action="review-reject" id="review-reject">淘汰 X</button
        ><button data-action="review-winner">保留当前，换下一张</button
        ><button data-action="review-save-winners" id="review-save-winners">保存本轮精选</button
        ><small>滚轮缩放 · 拖动检查 · 1–5 评分 · Tab 切换目标</small>
      </footer>
    </dialog>
    <input
      id="import-files"
      type="file"
      multiple
      hidden
      accept="image/*,video/*,.tif,.tiff,.dng,.nef,.arw,.cr2,.cr3,.raf"
    /><input id="import-folder" type="file" multiple webkitdirectory hidden /><input
      id="barcode-file"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    /><input id="repair-file" type="file" accept="image/*,video/*,.bin" hidden />
    <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
    <script type="module" src="studio.mjs"></script>
  </body>
</html>
