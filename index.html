<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ebe8df">
  <title>Film Album · 胶卷相册</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Film Album 首页">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span><b>FILM</b> ALBUM</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="btn-theme" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
      <button class="icon-btn" id="btn-fullscreen" title="全屏工作台" aria-label="全屏工作台">⛶</button>
      <button class="primary-btn" id="btn-import"><span>＋</span> 装入照片 / 视频</button>
      <input id="file-input" type="file" accept="image/*,video/*" multiple hidden>
    </div>
  </header>

  <main class="workspace">
    <aside class="library-panel">
      <div class="panel-heading">
        <div><span class="eyebrow">YOUR ARCHIVE</span><h1>胶卷库</h1></div>
        <button class="round-btn" id="btn-new-roll" title="新建胶卷" aria-label="新建胶卷">＋</button>
      </div>
      <div class="roll-list" id="roll-list"></div>
      <div class="library-foot">
        <button class="quiet-btn" id="btn-demo">加载演示胶卷</button>
        <button class="quiet-btn danger" id="btn-delete-roll">删除当前胶卷</button>
      </div>
    </aside>

    <section class="stage-panel" id="drop-zone">
      <div class="stage-meta">
        <div>
          <span class="eyebrow" id="roll-stock-label">FUJIFILM</span>
          <h2 id="roll-title">未命名胶卷</h2>
        </div>
        <div class="frame-counter"><b id="current-index">00</b><span>/</span><span id="total-count">00</span></div>
      </div>

      <div class="film-machine" id="film-machine">
        <div class="empty-state" id="empty-state">
          <span class="empty-reel">◎</span>
          <h3>这卷胶片还是空的</h3>
          <p>拖入照片或视频，开始制作一卷属于你的影像。</p>
          <button class="primary-btn" id="btn-empty-import">装入第一格</button>
        </div>
        <div class="film-viewport" id="film-viewport" hidden>
          <button class="film-nav prev" id="btn-prev" aria-label="上一格">‹</button>
          <div class="film-strip" id="film-strip" tabindex="0" aria-label="胶片帧"></div>
          <button class="film-nav next" id="btn-next" aria-label="下一格">›</button>
        </div>
        <div class="canister-wrap" aria-label="135 胶卷暗盒">
          <div class="canister" id="canister">
            <div class="spool"><i></i></div>
            <div class="cap top"></div>
            <div class="can-body">
              <div class="cassette-label">
                <span class="cassette-brand" id="cassette-brand">FUJIFILM</span>
                <strong id="cassette-name">Velvia</strong>
                <b id="cassette-iso">50</b>
                <small>135 · 36 EXP</small>
              </div>
            </div>
            <div class="cap bottom"></div>
            <div class="felt-lip"></div>
          </div>
        </div>
      </div>

      <div class="stage-foot">
        <div class="pull-control">
          <span>抽片</span>
          <input id="pull-range" type="range" min="0" max="100" value="72" aria-label="胶片抽出长度">
        </div>
        <p>拖动胶片逐格浏览 · 点击画面进入显影室</p>
        <button class="quiet-btn" id="btn-shuffle">随机回看</button>
      </div>
    </section>

    <aside class="lab-panel">
      <div class="panel-heading compact"><div><span class="eyebrow">SPEKTRA LAB</span><h2>显影参数</h2></div></div>
      <label class="field-label" for="stock-select">胶片模拟</label>
      <select id="stock-select"></select>
      <div class="stock-swatches" id="stock-swatches"></div>
      <div class="control"><div><label for="intensity">效果浓度</label><output id="intensity-value">72</output></div><input id="intensity" type="range" min="0" max="100" value="72"></div>
      <div class="control"><div><label for="grain">银盐颗粒</label><output id="grain-value">28</output></div><input id="grain" type="range" min="0" max="100" value="28"></div>
      <div class="control"><div><label for="halation">高光晕染</label><output id="halation-value">18</output></div><input id="halation" type="range" min="0" max="100" value="18"></div>
      <div class="control"><div><label for="vignette">暗角</label><output id="vignette-value">12</output></div><input id="vignette" type="range" min="0" max="100" value="12"></div>
      <div class="divider"></div>
      <label class="toggle-row"><span><b>逐格显影</b><small>新导入的画面先显示为负片</small></span><input id="develop-mode" type="checkbox" checked><i></i></label>
      <label class="toggle-row"><span><b>播放视频声音</b><small>打开单格视频时允许播放</small></span><input id="video-sound" type="checkbox"><i></i></label>
      <div class="lab-actions"><button class="quiet-btn" id="btn-export-manifest">导出目录</button><button class="quiet-btn" id="btn-reset-look">还原效果</button></div>
    </aside>
  </main>

  <nav class="mobile-nav">
    <button data-mobile="library">胶卷库</button><button data-mobile="stage" class="active">浏览</button><button data-mobile="lab">显影</button>
  </nav>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-top"><div><span id="viewer-roll"></span><b id="viewer-number">01 / 24</b></div><button class="icon-btn inverted" id="viewer-close" aria-label="关闭">×</button></div>
    <button class="viewer-nav prev" id="viewer-prev" aria-label="上一张">‹</button>
    <div class="viewer-media" id="viewer-media"></div>
    <button class="viewer-nav next" id="viewer-next" aria-label="下一张">›</button>
    <div class="viewer-bottom"><button class="develop-btn" id="btn-develop"><span>✦</span> 点击显影</button><p id="viewer-caption"></p><button class="quiet-btn light" id="btn-delete-frame">移除此格</button></div>
  </div>

  <dialog id="new-roll-dialog">
    <form method="dialog" id="new-roll-form">
      <div class="dialog-head"><div><span class="eyebrow">NEW ROLL</span><h2>装一卷新胶片</h2></div><button value="cancel" class="icon-btn" aria-label="关闭">×</button></div>
      <label>胶卷名称<input id="new-roll-name" maxlength="40" value="周末散步"></label>
      <label>胶片类型<select id="new-roll-stock"></select></label>
      <div class="dialog-actions"><button value="cancel" class="quiet-btn">取消</button><button value="default" class="primary-btn" id="confirm-new-roll">创建胶卷</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
